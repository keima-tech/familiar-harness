<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Familiar</title>
  <link rel="stylesheet" href="/app.css" />
</head>
<body>
  <div id="app">
    <aside id="sidebar">
      <div class="side-head">
        <span class="logo">◍ familiar</span>
        <button id="new-session" title="new session">＋</button>
      </div>
      <div id="new-session-panel" hidden>
        <div class="field-row">
          <label for="ns-provider">provider</label>
          <select id="ns-provider"></select>
          <span id="ns-auth" class="hint"></span>
        </div>
        <div class="field-row">
          <label for="ns-model">model</label>
          <input id="ns-model" list="ns-models" spellcheck="false" placeholder="provider default" />
          <datalist id="ns-models"></datalist>
        </div>
        <div class="field-row">
          <label for="ns-profile">profile</label>
          <select id="ns-profile"></select>
        </div>
        <div class="panel-row">
          <button id="ns-create">Create</button>
          <button id="ns-cancel" class="ghost">Cancel</button>
        </div>
      </div>
      <ul id="sessions"></ul>
      <div class="side-foot">
        <button id="toggle-inbox" class="ghost">✎ inbox <span id="inbox-count" class="badge">0</span></button>
        <button id="toggle-status" class="ghost">⚙ status</button>
      </div>
    </aside>

    <main id="main">
      <header id="topbar">
        <div class="title-wrap">
          <div id="session-title" class="title">no session</div>
          <div id="session-meta" class="meta"></div>
        </div>
        <div id="turn-state" class="state"></div>
      </header>

      <section id="transcript"></section>

      <div id="approval-dock"></div>

      <form id="composer">
        <textarea id="input" rows="2" placeholder="message… (Enter to send / Shift+Enter newline)"></textarea>
        <button id="send" type="submit">Send</button>
      </form>
    </main>

    <aside id="inbox" hidden>
      <div class="inbox-head">
        <b>approval inbox</b>
        <button id="close-inbox" class="ghost">✕</button>
      </div>
      <div id="inbox-body"></div>
    </aside>

    <aside id="status" hidden>
      <div class="inbox-head">
        <b>system status</b>
        <button id="close-status" class="ghost">✕</button>
      </div>
      <div id="status-body"></div>
    </aside>
  </div>
  <script src="/app.js"></script>
</body>
</html>
