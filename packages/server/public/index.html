<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Familiar</title>
  <link rel="stylesheet" href="/app.css" />
</head>
<body>
  <div id="app">
    <aside id="sidebar">
      <div class="side-head">
        <span class="logo">◍ familiar</span>
        <button id="new-session" title="new session">＋</button>
      </div>
      <div id="session-search" class="search-row">
        <input id="session-filter" type="search" placeholder="filter sessions…  (Ctrl+K)" autocomplete="off" spellcheck="false" />
      </div>
      <div id="new-session-panel" hidden>
        <div class="field-row">
          <label for="ns-provider">provider</label>
          <select id="ns-provider"></select>
          <span id="ns-auth" class="hint"></span>
        </div>
        <div class="field-row">
          <label for="ns-model">model</label>
          <input id="ns-model" list="ns-models" spellcheck="false" placeholder="provider default" />
          <datalist id="ns-models"></datalist>
        </div>
        <div class="field-row">
          <label for="ns-profile">profile</label>
          <select id="ns-profile"></select>
        </div>
        <div class="panel-row">
          <button id="ns-create">Create</button>
          <button id="ns-cancel" class="ghost">Cancel</button>
        </div>
      </div>
      <ul id="sessions"></ul>
      <div class="side-foot">
        <button id="toggle-inbox" class="ghost">✎ inbox <span id="inbox-count" class="badge">0</span></button>
        <button id="toggle-status" class="ghost">⚙ status</button>
      </div>
    </aside>

    <main id="main">
      <header id="topbar">
        <div class="title-wrap">
          <span class="ticon">◍</span>
          <div class="title-col">
            <div id="session-title" class="title">no session</div>
            <div id="session-meta" class="meta"></div>
          </div>
        </div>
        <div class="top-actions">
          <div id="turn-state" class="state">
            <span id="turn-spinner" class="spinner" hidden></span><span id="turn-label"></span>
          </div>
          <span id="usage-chip" class="usage" hidden></span>
          <button id="search-toggle" class="iconbtn" title="search in transcript (Ctrl+F)">⌕</button>
          <div class="menu-wrap">
            <button id="session-menu-btn" class="iconbtn" title="session actions">⋯</button>
            <div id="session-menu-pop" class="pop" hidden>
              <button data-act="rename">Rename…</button>
              <button data-act="export">Export as Markdown</button>
              <hr />
              <button data-act="delete" class="danger">Delete session…</button>
            </div>
          </div>
        </div>
      </header>

      <div id="search-bar" hidden>
        <input id="transcript-search" type="search" placeholder="search in transcript…" autocomplete="off" spellcheck="false" />
        <span id="search-count"></span>
        <button id="search-close" class="iconbtn" title="close search">✕</button>
      </div>

      <section id="transcript"></section>

      <div id="approval-dock"></div>

      <form id="composer" autocomplete="off">
        <textarea id="input" rows="1" placeholder="Ask anything… (Enter to send / Shift+Enter for a new line)"></textarea>
        <div class="composer-foot">
          <button id="composer-new" type="button" title="new session">＋</button>
          <div class="menu-wrap">
            <button id="mode-chip" type="button" title="agent mode">Build ▾</button>
            <div id="mode-pop" class="pop" hidden>
              <button type="button" data-mode="build"><b>Build</b><small>full tool access</small></button>
              <button type="button" data-mode="plan"><b>Plan</b><small>read-only tools</small></button>
            </div>
          </div>
          <div class="menu-wrap">
            <button id="model-chip" type="button" title="model for this session">model ▾</button>
            <div id="model-pop" class="pop wide" hidden>
              <div class="field-row">
                <label for="mp-provider">provider</label>
                <select id="mp-provider"></select>
              </div>
              <div class="field-row">
                <label for="mp-model">model</label>
                <input id="mp-model" list="mp-models" spellcheck="false" placeholder="provider default" />
                <datalist id="mp-models"></datalist>
              </div>
              <div class="pop-actions">
                <button id="mp-apply" type="button">Apply</button>
                <button id="mp-cancel" type="button" class="ghost">Cancel</button>
              </div>
            </div>
          </div>
          <button id="send" type="submit" title="send (Enter)">↑</button>
        </div>
      </form>
    </main>

    <aside id="inbox" hidden>
      <div class="drawer-head">
        <b>approval inbox</b>
        <button id="close-inbox" class="ghost">✕</button>
      </div>
      <div id="inbox-body"></div>
    </aside>

    <aside id="status" hidden>
      <div class="drawer-head">
        <b>system status</b>
        <button id="close-status" class="ghost">✕</button>
      </div>
      <div id="status-body"></div>
    </aside>
  </div>
  <div id="toasts"></div>
  <script src="/app.js"></script>
</body>
</html>
