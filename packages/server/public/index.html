<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Familiar</title>
  <link rel="stylesheet" href="/app.css" />
</head>
<body>
  <div id="app">
    <aside id="sidebar">
      <div class="side-head">
        <span class="logo">◍ familiar</span>
        <button id="new-session" title="new session">＋</button>
      </div>
      <ul id="sessions"></ul>
      <div class="side-foot">
        <button id="toggle-inbox" class="ghost">✎ approval inbox <span id="inbox-count" class="badge">0</span></button>
      </div>
    </aside>

    <main id="main">
      <header id="topbar">
        <div id="session-title" class="title">no session</div>
        <div id="turn-state" class="state"></div>
      </header>

      <section id="transcript"></section>

      <div id="approval-dock"></div>

      <form id="composer">
        <textarea id="input" rows="2" placeholder="message… (Enter to send / Shift+Enter newline)"></textarea>
        <button id="send" type="submit">Send</button>
      </form>
    </main>

    <aside id="inbox" hidden>
      <div class="inbox-head">
        <b>approval inbox</b>
        <button id="close-inbox" class="ghost">✕</button>
      </div>
      <div id="inbox-body"></div>
    </aside>
  </div>
  <script src="/app.js"></script>
</body>
</html>
