<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Familiar Harness</title>
  <link rel="stylesheet" href="/app.css" />
</head>
<body>
  <div id="app">
    <aside id="sidebar">
      <div class="side-head">
        <span class="logo">◍ Familiar Harness</span>
        <button id="new-session" title="新規セッション" data-i18n-title="side.newSession">＋</button>
      </div>
      <div id="session-search" class="search-row">
        <input id="session-filter" type="search" placeholder="セッションを絞り込み…  (Ctrl+K)" data-i18n-ph="side.filterPh" autocomplete="off" spellcheck="false" />
      </div>
      <ul id="sessions"></ul>
      <div class="side-foot">
        <button id="toggle-inbox" class="ghost"><span data-i18n="side.inbox">✎ 承認インボックス</span> <span id="inbox-count" class="badge">0</span></button>
        <button id="toggle-status" class="ghost"><span data-i18n="side.status">⚙ ステータス</span></button>
        <button id="open-settings" class="ghost"><span data-i18n="side.settings">⚙ 設定</span></button>
      </div>
    </aside>

    <main id="main">
      <header id="topbar">
        <div class="title-wrap">
          <span class="ticon">◍</span>
          <div class="title-col">
            <div id="session-title" class="title">no session</div>
            <div class="meta-row">
              <div id="session-meta" class="meta"></div>
              <button id="edit-cwd" type="button" class="cwd-btn" title="作業フォルダーを変更" data-i18n-title="cwd.title" hidden>📁</button>
            </div>
          </div>
        </div>
        <div class="top-actions">
          <div id="turn-state" class="state">
            <span id="turn-spinner" class="spinner" hidden></span><span id="turn-label"></span>
          </div>
          <button id="ctx-gauge" class="gauge" title="コンテキスト使用量 — クリックでセッション情報" data-i18n-title="top.gaugeTitle">
            <svg viewBox="0 0 22 22" width="20" height="20">
              <circle class="gauge-track" cx="11" cy="11" r="8"></circle>
              <circle class="gauge-bar" cx="11" cy="11" r="8"></circle>
              <text x="11" y="14.5" text-anchor="middle">—</text>
            </svg>
          </button>
          <button id="search-toggle" class="iconbtn" title="トランスクリプト内検索 (Ctrl+F)" data-i18n-title="top.search">⌕</button>
          <div class="menu-wrap">
            <button id="session-menu-btn" class="iconbtn" title="セッション操作" data-i18n-title="top.sessionActions">⋯</button>
            <div id="session-menu-pop" class="pop" hidden>
              <button data-act="rename" data-i18n="menu.rename">名前を変更…</button>
              <button data-act="export" data-i18n="menu.export">Markdown で出力</button>
              <hr />
              <button data-act="delete" class="danger" data-i18n="menu.delete">セッションを削除…</button>
            </div>
          </div>
        </div>
      </header>

      <div id="search-bar" hidden>
        <input id="transcript-search" type="search" placeholder="トランスクリプトを検索…" data-i18n-ph="search.ph" autocomplete="off" spellcheck="false" />
        <span id="search-count"></span>
        <button id="search-close" class="iconbtn" title="検索を閉じる" data-i18n-title="search.close">✕</button>
      </div>

      <section id="transcript"></section>

      <div id="approval-dock"></div>

      <form id="composer" autocomplete="off">
        <textarea id="input" rows="1" placeholder="何でも聞いてください (Enter で送信 / Shift+Enter で改行)"></textarea>
        <div class="composer-foot">
          <button id="retry" type="button" title="直前の操作を再実行" data-i18n-title="composer.retry">↻</button>
          <div class="menu-wrap">
            <button id="composer-new" type="button" title="添付・追加" data-i18n-title="composer.plus">＋</button>
            <div id="plus-pop" class="pop up" hidden>
              <button type="button" data-ins="file"><span data-i18n="plus.file">📎 ファイルを添付…</span><small>@path</small></button>
              <button type="button" data-ins="ctx"><span data-i18n="plus.ctx">＠ コンテキスト追加</span><small>@</small></button>
              <button type="button" data-ins="shell"><span data-i18n="plus.shell">❯ シェルコマンド</span><small>!</small></button>
            </div>
          </div>
          <div class="menu-wrap">
            <button id="mode-chip" type="button" title="エージェントモード" data-i18n-title="chip.mode">Build ▾</button>
            <div id="mode-pop" class="pop up" hidden>
              <button type="button" data-mode="build"><b data-i18n="mode.build">Build</b><small data-i18n="mode.buildDesc">全ツール使用可</small></button>
              <button type="button" data-mode="plan"><b data-i18n="mode.plan">Plan</b><small data-i18n="mode.planDesc">読み取り専用ツール</small></button>
            </div>
          </div>
          <div class="menu-wrap">
            <button id="model-chip" type="button" title="セッションのモデル" data-i18n-title="chip.model">モデル ▾</button>
            <div id="model-pop" class="pop up wide" hidden>
              <div class="mp-search">
                <input id="mp-search" type="search" placeholder="モデルを検索…" data-i18n-ph="mp.search" autocomplete="off" spellcheck="false" />
              </div>
              <div id="mp-list" class="mp-list"></div>
              <button id="mp-settings" type="button" class="mp-foot">⚙ <span data-i18n="mp.manage">モデルを管理</span></button>
            </div>
          </div>
          <button id="send" type="submit" title="送信 (Enter)">↑</button>
        </div>
      </form>
    </main>

    <aside id="inbox" hidden>
      <div class="drawer-head">
        <b data-i18n="drawer.inbox">承認インボックス</b>
        <button id="close-inbox" class="ghost">✕</button>
      </div>
      <div id="inbox-body"></div>
    </aside>

    <aside id="status" hidden>
      <div class="drawer-head">
        <b data-i18n="drawer.status">システム状態</b>
        <button id="close-status" class="ghost">✕</button>
      </div>
      <div id="status-body"></div>
    </aside>

    <div id="cwd-overlay" class="overlay" hidden>
      <div class="modal cwd-modal">
        <h3 data-i18n="cwd.title">作業フォルダーを変更</h3>
        <input id="cwd-input" type="text" spellcheck="false" autocomplete="off" placeholder="/path/to/folder" />
        <div id="cwd-suggest" class="cwd-suggest"></div>
        <div class="form-error" hidden></div>
        <div class="pop-actions">
          <button id="cwd-browse" type="button" class="ghost link-left" hidden data-i18n="cwd.browse">📁 参照…</button>
          <button id="cwd-ok" type="button" data-i18n="cwd.ok">設定</button>
          <button id="cwd-cancel" type="button" class="ghost" data-i18n="cwd.cancel">キャンセル</button>
        </div>
      </div>
    </div>

    <div id="settings-overlay" class="overlay" hidden>
    <div class="modal" role="dialog" aria-label="settings">
      <div class="modal-head">
        <b data-i18n="settings.title">設定</b>
        <button id="close-settings" class="iconbtn" title="閉じる (Esc)" data-i18n-title="search.close">✕</button>
      </div>
      <div class="modal-body">
        <nav id="settings-nav"></nav>
        <div id="settings-content"></div>
      </div>
    </div>
  </div>

    <aside id="session-info" hidden>
      <div class="drawer-head">
        <b data-i18n="drawer.info">セッション情報</b>
        <button id="close-info" class="ghost">✕</button>
      </div>
      <div id="info-body"></div>
    </aside>
  </div>
  <div id="ctx-menu" class="pop ctx" hidden>
    <button data-act="rename" data-i18n="menu.rename">名前を変更…</button>
    <button data-act="export" data-i18n="menu.export">Markdown で出力</button>
    <hr />
    <button data-act="delete" class="danger" data-i18n="menu.deleteShort">削除…</button>
  </div>
  <input id="file-attach" type="file" hidden />
  <div id="toasts"></div>
  <script src="/app.js"></script>
</body>
</html>
