<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Familiar Harness</title>
  <link rel="icon" href="/favicon.ico" sizes="any" />
  <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
  <link rel="apple-touch-icon" href="/icon-192.png" />
  <link rel="stylesheet" href="/app.css" />
</head>
<body>
  <div id="app">
    <div id="drawer-backdrop" hidden></div>
    <aside id="sidebar">
      <div class="side-head">
        <span class="logo"><img class="logo-ic" src="/icon-32.png" alt="" /> Familiar Harness</span>
        <button id="close-sidebar" class="ghost" aria-label="close">✕</button>
      </div>
      <button id="new-session" class="new-session-btn" title="新規セッション" data-i18n-title="side.newSession">
        <span class="ns-plus">＋</span><span data-i18n="side.newSession">新しいセッション</span>
      </button>
      <div id="session-search" class="search-row">
        <input id="session-filter" type="search" placeholder="セッションを絞り込み…  (Ctrl+K)" data-i18n-ph="side.filterPh" autocomplete="off" spellcheck="false" />
      </div>
      <ul id="sessions"></ul>
      <div class="side-foot">
        <button id="open-settings" class="ghost"><span data-i18n="side.settings">⚙ 設定</span></button>
      </div>
    </aside>

    <main id="main">
      <header id="topbar">
        <div class="title-wrap">
          <button id="sidebar-toggle" class="iconbtn" title="セッション一覧" data-i18n-title="top.sessions" aria-label="sessions">☰</button>
          <span class="ticon">◍</span>
          <div class="title-col">
            <div class="title-row">
              <div id="session-title" class="title">no session</div>
              <div class="menu-wrap">
                <button id="session-menu-btn" class="iconbtn" title="セッション操作" data-i18n-title="top.sessionActions">⋯</button>
                <div id="session-menu-pop" class="pop" hidden>
                  <button data-act="rename" data-i18n="menu.rename">名前を変更…</button>
                  <button data-act="export" data-i18n="menu.export">Markdown で出力</button>
                  <button data-act="update-check" data-i18n="menu.updateCheck">アップデートを確認</button>
                  <hr />
                  <button data-act="delete" class="danger" data-i18n="menu.delete">セッションを削除…</button>
                </div>
              </div>
              <button id="search-toggle" class="iconbtn" title="トランスクリプト内検索 (Ctrl+F)" data-i18n-title="top.search">⌕</button>
            </div>
            <div class="meta-row">
              <div id="session-meta" class="meta"></div>
              <button id="edit-cwd" type="button" class="cwd-btn" title="作業フォルダーを変更" data-i18n-title="cwd.title" hidden>📁</button>
            </div>
          </div>
        </div>
        <div class="top-actions">
          <button id="update-btn" class="iconbtn update-btn" hidden title="update available">⬇</button>
          <div id="turn-state" class="state">
            <span id="turn-spinner" class="spinner" hidden></span><span id="turn-label"></span>
          </div>
          <button id="ctx-gauge" class="gauge" title="コンテキスト使用量" data-i18n-title="chip.ctx">
            <svg viewBox="0 0 22 22" width="20" height="20">
              <circle class="gauge-track" cx="11" cy="11" r="8"></circle>
              <circle class="gauge-bar" cx="11" cy="11" r="8"></circle>
            </svg>
            <span id="gauge-pct" class="gauge-pct">—</span>
          </button>
          <button id="pane-toggle" class="iconbtn" title="サイドペイン" data-i18n-title="top.pane">▤</button>
        </div>
      </header>

      <div id="search-bar" hidden>
        <input id="transcript-search" type="search" placeholder="トランスクリプトを検索…" data-i18n-ph="search.ph" autocomplete="off" spellcheck="false" />
        <span id="search-count"></span>
        <button id="search-close" class="iconbtn" title="検索を閉じる" data-i18n-title="search.close">✕</button>
      </div>

      <section id="transcript"></section>

      <div id="approval-dock"></div>

      <form id="composer" autocomplete="off">
        <div id="attach-strip" class="attach-strip" hidden></div>
        <textarea id="input" rows="1" placeholder="何でも聞いてください (Enter で送信 / Shift+Enter で改行)"></textarea>
        <div class="composer-foot">
          <button id="retry" type="button" title="直前の操作を再実行" data-i18n-title="composer.retry">↻</button>
          <div class="menu-wrap">
            <button id="composer-new" type="button" title="添付・追加" data-i18n-title="composer.plus">＋</button>
            <div id="cmd-pop" class="pop up" hidden>
              <div id="cmd-list" class="mp-list"></div>
            </div>
            <div id="plus-pop" class="pop up" hidden>
              <button type="button" data-ins="file"><span data-i18n="plus.file">📎 ファイルを添付…</span><small>@path</small></button>
              <button type="button" data-ins="ctx"><span data-i18n="plus.ctx">＠ コンテキスト追加</span><small>@</small></button>
              <button type="button" data-ins="shell"><span data-i18n="plus.shell">❯ シェルコマンド</span><small>!</small></button>
            </div>
          </div>
          <div class="menu-wrap">
            <button id="mode-chip" type="button" title="エージェントモード" data-i18n-title="chip.mode">Build ▾</button>
            <div id="mode-pop" class="pop up" hidden>
              <button type="button" data-mode="build"><b data-i18n="mode.build">Build</b><small data-i18n="mode.buildDesc">全ツール使用可</small></button>
              <button type="button" data-mode="plan"><b data-i18n="mode.plan">Plan</b><small data-i18n="mode.planDesc">読み取り専用ツール</small></button>
            </div>
          </div>
          <div class="menu-wrap">
            <button id="model-chip" type="button" title="セッションのモデル" data-i18n-title="chip.model">モデル ▾</button>
            <div id="model-pop" class="pop up wide" hidden>
              <div class="mp-search">
                <input id="mp-search" type="search" placeholder="モデルを検索…" data-i18n-ph="mp.search" autocomplete="off" spellcheck="false" />
              </div>
              <div id="mp-list" class="mp-list"></div>
              <button id="mp-settings" type="button" class="mp-foot">⚙ <span data-i18n="mp.manage">モデルを管理</span></button>
            </div>
          </div>
          <div class="menu-wrap">
            <button id="effort-chip" type="button" title="推論エフォート" data-i18n-title="chip.effort">既定 ▾</button>
            <div id="effort-pop" class="pop up" hidden>
              <button type="button" data-effort=""><b data-i18n="effort.default">既定</b><small data-i18n="effort.defaultDesc">モデル側の既定エフォート</small></button>
              <button type="button" data-effort="low"><b>low</b><small data-i18n="effort.lowDesc">低</small></button>
              <button type="button" data-effort="medium"><b>medium</b><small data-i18n="effort.mediumDesc">中</small></button>
              <button type="button" data-effort="high"><b>high</b><small data-i18n="effort.highDesc">高</small></button>
            </div>
          </div>
          <div class="menu-wrap">
            <button id="ctx-btn" type="button" title="コンテキスト使用量" data-i18n-title="chip.ctx">
              <svg viewBox="0 0 22 22" width="16" height="16">
                <circle class="gauge-track" cx="11" cy="11" r="8"></circle>
                <circle class="gauge-bar" cx="11" cy="11" r="8"></circle>
                <text x="11" y="14.5" text-anchor="middle">—</text>
              </svg>
            </button>
            <div id="ctx-pop" class="pop up ctx-pop" hidden>
              <div class="ctx-head">
                <svg viewBox="0 0 22 22" width="44" height="44">
                  <circle class="gauge-track" cx="11" cy="11" r="8"></circle>
                  <circle class="gauge-bar" cx="11" cy="11" r="8"></circle>
                  <text x="11" y="14.5" text-anchor="middle">—</text>
                </svg>
                <div class="ctx-head-text">
                  <b id="ctx-head-pct">—</b>
                  <span id="ctx-head-model"></span>
                </div>
              </div>
              <div class="ctx-grid">
                <div><small data-i18n="ctx.used">使用</small><span id="ctx-used">—</span></div>
                <div><small data-i18n="ctx.window">上限</small><span id="ctx-window">—</span></div>
                <div><small data-i18n="ctx.free">残り</small><span id="ctx-free">—</span></div>
              </div>
              <div id="ctx-note" class="ctx-note"></div>
            </div>
          </div>
          <button id="send" type="submit" title="送信 (Enter)" data-i18n-title="send.enter">↑</button>
        </div>
      </form>
    </main>

    <div id="cwd-overlay" class="overlay" hidden>
      <div class="modal cwd-modal">
        <h3 data-i18n="cwd.title">作業フォルダーを変更</h3>
        <input id="cwd-input" type="text" spellcheck="false" autocomplete="off" placeholder="/path/to/folder" />
        <div id="cwd-suggest" class="cwd-suggest"></div>
        <div class="form-error" hidden></div>
        <div class="pop-actions">
          <button id="cwd-browse" type="button" class="ghost link-left" hidden data-i18n="cwd.browse">📁 参照…</button>
          <button id="cwd-ok" type="button" data-i18n="cwd.ok">設定</button>
          <button id="cwd-cancel" type="button" class="ghost" data-i18n="cwd.cancel">キャンセル</button>
        </div>
      </div>
    </div>

    <div id="new-session-overlay" class="overlay" hidden>
      <div class="modal new-session-modal">
        <div class="modal-head">
          <b data-i18n="ns.title">新規セッション</b>
          <button id="ns-close" class="ghost">✕</button>
        </div>
        <div class="ns-body">
          <div class="ns-search">
            <input id="ns-folder-input" type="text" spellcheck="false" autocomplete="off"
              placeholder="フォルダーを検索・入力… (例: ~/work)" data-i18n-ph="ns.search" />
          </div>
          <div class="ns-center">
            <div class="ns-label" data-i18n="ns.pickFolder">作業フォルダーを選択</div>
            <div id="ns-list" class="ns-folders"></div>
          </div>
        </div>
        <div class="form-error" hidden></div>
        <div class="pop-actions">
          <button id="ns-browse" type="button" class="ghost link-left" hidden data-i18n="cwd.browse">📁 参照…</button>
          <button id="ns-create" type="button" data-i18n="ns.create">作成</button>
          <button id="ns-cancel" type="button" class="ghost" data-i18n="cwd.cancel">キャンセル</button>
        </div>
      </div>
    </div>

    <div id="settings-overlay" class="overlay" hidden>
    <div class="modal" role="dialog" aria-label="settings">
      <div class="modal-head">
        <span class="settings-brand"><img class="brand-ic" src="/brand.png" alt="" /><b data-i18n="settings.title">設定</b></span>
        <button id="close-settings" class="iconbtn" title="閉じる (Esc)" data-i18n-title="settings.close">✕</button>
      </div>
      <div class="modal-body">
        <nav id="settings-nav"></nav>
        <div id="settings-content"></div>
      </div>
    </div>
  </div>

    <aside id="rightpane" hidden>
      <div id="pane-resizer" title=""></div>
      <div class="pane-tabs">
        <button type="button" data-tab="inbox"><span data-i18n="pane.inbox">承認</span><span id="inbox-count" class="badge"></span></button>
        <button type="button" data-tab="todo"><span data-i18n="pane.todo">タスク</span><span id="todo-count" class="badge"></span></button>
        <button type="button" data-tab="files"><span data-i18n="pane.files">ファイル</span></button>
        <button type="button" data-tab="ctx"><span data-i18n="pane.ctx">コンテキスト</span></button>
        <button id="close-pane" class="ghost" title="✕">✕</button>
      </div>
      <div class="pane-body">
        <div id="inbox" class="pane-panel" hidden><div id="inbox-body"></div></div>
        <div id="todo" class="pane-panel" hidden><div id="todo-body"></div></div>
        <div id="files" class="pane-panel" hidden>
          <div id="files-tree"></div>
          <div id="files-view" hidden></div>
        </div>
        <div id="ctx" class="pane-panel" hidden><div id="ctx-pane-body"></div></div>
      </div>
    </aside>
  </div>
  <div id="ctx-menu" class="pop ctx" hidden>
    <button data-act="rename" data-i18n="menu.rename">名前を変更…</button>
    <button data-act="export" data-i18n="menu.export">Markdown で出力</button>
    <hr />
    <button data-act="delete" class="danger" data-i18n="menu.deleteShort">削除…</button>
  </div>
  <input id="file-attach" type="file" multiple hidden />
  <div id="img-overlay" hidden><img id="img-overlay-img" alt="" /></div>
  <div id="toasts"></div>
  <script src="/app.js"></script>
</body>
</html>
